<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahih Muslim - Digital Hadith Explorer</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --border: #334155;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.2s, border-color 0.2s, color 0.2s;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Layout */
        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .header-container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand i {
            color: var(--accent);
            font-size: 1.8rem;
        }

        .brand h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-grow: 1;
            max-width: 600px;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .search-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        input[type="text"] {
            width: 100%;
            padding: 0.65rem 1rem 0.65rem 2.5rem;
            border-radius: 9999px;
            border: 1px solid var(--border);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        .btn-icon {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-icon:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Main Section & Cards */
        main {
            max-width: 1300px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
            flex-grow: 1;
        }

        .stats-bar {
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hadith-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.75rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .hadith-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
        }

        .badge {
            background-color: rgba(2, 132, 199, 0.15);
            color: var(--accent);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 1.55rem;
            line-height: 2.2;
            direction: rtl;
            text-align: right;
            color: var(--text-primary);
        }

        .english-text {
            font-size: 1.05rem;
            line-height: 1.65;
            color: var(--text-primary);
        }

        .actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin: 2rem 0;
        }

        .pagination-btn {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.5rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-btn:not(:disabled):hover {
            border-color: var(--accent);
            background-color: var(--accent);
            color: #ffffff;
        }

        /* Loader */
        .spinner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 0;
            gap: 1rem;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid var(--border);
            border-bottom-color: var(--accent);
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="brand">
                <i class="fa-solid fa-book-quran"></i>
                <h1>Sahih Muslim Collection</h1>
            </div>
            
            <div class="controls">
                <div class="search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search Hadith by text or number (e.g., 1, 500)...">
                </div>
                <button class="btn-icon" id="themeToggle" title="Toggle Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="stats-bar">
            <span id="resultStats">Connecting to Sahih Muslim API...</span>
            <span id="pageStats"></span>
        </div>

        <div id="hadithContainer">
            <div class="spinner-container">
                <div class="spinner"></div>
                <p>Downloading complete Arabic and English datasets...</p>
            </div>
        </div>

        <div class="pagination">
            <button class="pagination-btn" id="prevBtn" disabled><i class="fa-solid fa-arrow-left"></i> Previous</button>
            <span id="currentPageIndicator">1</span>
            <button class="pagination-btn" id="nextBtn">Next <i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </main>

    <script>
        // API Sources
        const ARABIC_API = 'https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ara-muslim.min.json';
        const ENGLISH_API = 'https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/eng-muslim.min.json';

        // State Management
        let combinedHadiths = [];
        let filteredHadiths = [];
        let currentPage = 1;
        const itemsPerPage = 10;

        // DOM Handles
        const hadithContainer = document.getElementById('hadithContainer');
        const searchInput = document.getElementById('searchInput');
        const resultStats = document.getElementById('resultStats');
        const pageStats = document.getElementById('pageStats');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const currentPageIndicator = document.getElementById('currentPageIndicator');
        const themeToggle = document.getElementById('themeToggle');

        // Robust Fetch & Cross-Reference Mapping Logic
        async function fetchHadithData() {
            try {
                const [araRes, engRes] = await Promise.all([
                    fetch(ARABIC_API),
                    fetch(ENGLISH_API)
                ]);

                if (!araRes.ok || !engRes.ok) throw new Error("API request failed.");

                const araData = await araRes.json();
                const engData = await engRes.json();

                const araList = araData.hadiths || [];
                const engList = engData.hadiths || [];

                // Create flexible lookup maps for English text
                const engMapByNum = new Map();
                engList.forEach(h => {
                    if (h.hadithnumber !== undefined) {
                        engMapByNum.set(String(h.hadithnumber), h.text);
                        engMapByNum.set(Number(h.hadithnumber), h.text);
                    }
                });

                // Merge with fallbacks (hadithnumber -> array index)
                combinedHadiths = araList.map((item, index) => {
                    const hNum = item.hadithnumber;
                    
                    let englishText = 
                        engMapByNum.get(hNum) || 
                        engMapByNum.get(String(hNum)) || 
                        (engList[index] ? engList[index].text : null) || 
                        "Translation currently unavailable.";

                    return {
                        number: hNum || (index + 1),
                        arabicText: item.text || '',
                        englishText: englishText
                    };
                });

                filteredHadiths = combinedHadiths;
                renderPage();

            } catch (err) {
                console.error(err);
                hadithContainer.innerHTML = `
                    <div style="text-align: center; color: #ef4444; padding: 2rem;">
                        <i class="fa-solid fa-triangle-exclamation" style="font-size: 2rem; margin-bottom: 0.5rem;"></i>
                        <p>Error loading Sahih Muslim database. Please check your connection and refresh.</p>
                    </div>`;
                resultStats.textContent = 'API Connection Error';
            }
        }

        // Render Page Function
        function renderPage() {
            const total = filteredHadiths.length;
            const totalPages = Math.ceil(total / itemsPerPage) || 1;
            
            if (currentPage > totalPages) currentPage = 1;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, total);
            const currentSlice = filteredHadiths.slice(startIndex, endIndex);

            resultStats.textContent = `Total Hadiths Found: ${total.toLocaleString()}`;
            pageStats.textContent = `Page ${currentPage} of ${totalPages}`;
            currentPageIndicator.textContent = currentPage;

            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages || totalPages === 0;

            if (total === 0) {
                hadithContainer.innerHTML = `<div style="text-align:center; padding: 3rem; color: var(--text-muted);">No Hadiths found matching your query.</div>`;
                return;
            }

            hadithContainer.innerHTML = currentSlice.map(h => `
                <div class="hadith-card">
                    <div class="hadith-meta">
                        <span class="badge">Sahih Muslim #${h.number}</span>
                        <div class="actions">
                            <button class="btn-icon" onclick="copyToClipboard(${h.number})" title="Copy Text">
                                <i class="fa-regular fa-copy"></i>
                            </button>
                        </div>
                    </div>
                    <div class="arabic-text">${h.arabicText}</div>
                    <div class="english-text">${h.englishText}</div>
                </div>
            `).join('');
        }

        // Real-time Search Handler
        let debounceTimer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                const query = e.target.value.trim().toLowerCase();
                if (!query) {
                    filteredHadiths = combinedHadiths;
                } else {
                    filteredHadiths = combinedHadiths.filter(h => 
                        String(h.number) === query ||
                        h.englishText.toLowerCase().includes(query) ||
                        h.arabicText.includes(query)
                    );
                }
                currentPage = 1;
                renderPage();
            }, 200);
        });

        // Navigation Controls
        prevBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderPage();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        nextBtn.addEventListener('click', () => {
            const totalPages = Math.ceil(filteredHadiths.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderPage();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        // Copy Helper
        window.copyToClipboard = function(hadithNum) {
            const item = combinedHadiths.find(h => h.number === hadithNum);
            if (!item) return;
            const fullText = `Sahih Muslim #${item.number}\n\n${item.arabicText}\n\n${item.englishText}`;
            navigator.clipboard.writeText(fullText).then(() => {
                alert(`Sahih Muslim #${hadithNum} copied to clipboard!`);
            });
        };

        // Theme Switcher
        themeToggle.addEventListener('click', () => {
            const isLight = document.body.getAttribute('data-theme') === 'light';
            document.body.setAttribute('data-theme', isLight ? 'dark' : 'light');
            themeToggle.querySelector('i').className = isLight ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        });

        // Initialize App
        fetchHadithData();
    </script>
</body>
</html>
