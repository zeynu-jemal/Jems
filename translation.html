<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Vibrant - Multi-Language Experience</title>
    <!-- Google Fonts for typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(255, 255, 255, 0.92);
            --glass-border: rgba(255, 255, 255, 0.2);
            --primary-accent: #059669;
            --emerald-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --gold-accent: #f59e0b;
            --purple-accent: #8b5cf6;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --arabic-font: 'Amiri', serif;
            --sans-font: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--sans-font);
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        /* Header Styling */
        header {
            text-align: center;
            margin-bottom: 35px;
            position: relative;
        }

        .badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: var(--gold-accent);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
            backdrop-filter: blur(5px);
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #a7f3d0, #fef08a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        header p {
            color: #cbd5e1;
            font-size: 1.1rem;
            font-weight: 400;
        }

        /* Control Panel */
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            margin-bottom: 35px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #f1f5f9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid transparent;
            border-radius: 12px;
            outline: none;
            font-family: var(--sans-font);
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        select:focus {
            border-color: var(--gold-accent);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.25);
        }

        /* Verse Cards */
        .verses-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .verse-card {
            background: var(--card-bg);
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .verse-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 22px 45px rgba(0, 0, 0, 0.3);
        }

        .verse-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background: var(--emerald-gradient);
        }

        .verse-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .verse-badge {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(217, 119, 6, 0.3);
        }

        .arabic-text {
            font-family: var(--arabic-font);
            font-size: 2.2rem;
            text-align: right;
            direction: rtl;
            color: #065f46;
            margin-bottom: 20px;
            line-height: 2.3;
            font-weight: 700;
            padding-bottom: 15px;
            border-bottom: 1px dashed rgba(0, 0, 0, 0.1);
        }

        .translated-text {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #334155;
            font-weight: 600;
        }

        /* Loader Animation */
        .loader {
            text-align: center;
            padding: 50px;
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid var(--gold-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        .loader-text {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive tweaks */
        @media (max-width: 600px) {
            header h1 { font-size: 2rem; }
            .arabic-text { font-size: 1.7rem; line-height: 2.1; }
            .verse-card { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <span class="badge">✦ Live Quran Explorer ✦</span>
        <h1>القرآن الكريم</h1>
        <p>Read and explore translations from around the world</p>
    </header>

    <div class="controls">
        <div class="control-group">
            <label for="surahSelect">📖 Select Surah</label>
            <select id="surahSelect"></select>
        </div>

        <div class="control-group">
            <label for="editionSelect">🌐 Full Language & Translator</label>
            <select id="editionSelect"></select>
        </div>
    </div>

    <div id="loader" class="loader">
        <div class="spinner"></div>
        <div class="loader-text">Fetching verses...</div>
    </div>

    <div id="versesContainer" class="verses-container"></div>
</div>

<script>
    const API_BASE = "https://api.alquran.cloud/v1";
    const surahSelect = document.getElementById("surahSelect");
    const editionSelect = document.getElementById("editionSelect");
    const versesContainer = document.getElementById("versesContainer");
    const loader = document.getElementById("loader");

    // Comprehensive Language Map for display in Full Form
    const languageNamesMap = {
        'ar': 'ARABIC',
        'az': 'AZERBAIJANI',
        'bg': 'BULGARIAN',
        'bn': 'BENGALI',
        'bs': 'BOSNIAN',
        'cs': 'CZECH',
        'de': 'GERMAN',
        'dv': 'DIVHEI (MALDIVIAN)',
        'en': 'ENGLISH',
        'es': 'SPANISH',
        'fa': 'PERSIAN (FARSI)',
        'fr': 'FRENCH',
        'ha': 'HAUSA',
        'hi': 'HINDI',
        'id': 'INDONESIAN',
        'it': 'ITALIAN',
        'ja': 'JAPANESE',
        'ko': 'KOREAN',
        'ku': 'KURDISH',
        'ml': 'MALAYALAM',
        'nl': 'DUTCH',
        'no': 'NORWEGIAN',
        'pl': 'POLISH',
        'pt': 'PORTUGUESE',
        'ro': 'ROMANIAN',
        'ru': 'RUSSIAN',
        'sd': 'SINDHI',
        'so': 'SOMALI',
        'sq': 'ALBANIAN',
        'sv': 'SWEDISH',
        'sw': 'SWAHILI',
        'ta': 'TAMIL',
        'tg': 'TAJIK',
        'th': 'THAI',
        'tr': 'TURKISH',
        'tt': 'TATAR',
        'ug': 'UYGHUR',
        'ur': 'URDU',
        'uz': 'UZBEK',
        'zh': 'CHINESE'
    };

    async function init() {
        await Promise.all([loadSurahs(), loadTranslations()]);
        fetchSurahData();

        surahSelect.addEventListener("change", fetchSurahData);
        editionSelect.addEventListener("change", fetchSurahData);
    }

    // 1. Fetch Surah List
    async function loadSurahs() {
        try {
            const res = await fetch(`${API_BASE}/surah`);
            const data = await res.json();
            surahSelect.innerHTML = data.data.map(surah => 
                `<option value="${surah.number}">
                    ${surah.number}. ${surah.englishName} — (${surah.name})
                </option>`
            ).join('');
        } catch (err) {
            console.error("Failed to fetch Surahs:", err);
        }
    }

    // 2. Fetch Translations and map to full language names
    async function loadTranslations() {
        try {
            const res = await fetch(`${API_BASE}/edition/type/translation`);
            const data = await res.json();
            
            editionSelect.innerHTML = data.data.map(edition => {
                const langCode = edition.language.toLowerCase();
                // Map code to full form name if available
                const fullLanguageName = languageNamesMap[langCode] || edition.language.toUpperCase();
                const isSelected = edition.identifier === 'en.sahih' ? 'selected' : '';

                return `<option value="${edition.identifier}" ${isSelected}>
                    ${fullLanguageName} — ${edition.englishName}
                </option>`;
            }).join('');
        } catch (err) {
            console.error("Failed to fetch translations:", err);
        }
    }

    // 3. Fetch Surah Text (Uthmani Arabic + Selected Translation)
    async function fetchSurahData() {
        const surahId = surahSelect.value;
        const translationEdition = editionSelect.value;

        if (!surahId || !translationEdition) return;

        showLoader(true);
        versesContainer.innerHTML = '';

        try {
            const res = await fetch(`${API_BASE}/surah/${surahId}/editions/quran-uthmani,${translationEdition}`);
            const result = await res.json();

            const arabicAyahs = result.data[0].ayahs;
            const translatedAyahs = result.data[1].ayahs;

            renderVerses(arabicAyahs, translatedAyahs);
        } catch (err) {
            versesContainer.innerHTML = `<p style="color: #f87171; text-align: center; font-weight: bold;">Failed to load translation data. Please check your network connection.</p>`;
            console.error("Error fetching Surah details:", err);
        } finally {
            showLoader(false);
        }
    }

    // 4. Render Verses to DOM
    function renderVerses(arabicArray, translationArray) {
        const html = arabicArray.map((arabicAyah, index) => {
            const translatedText = translationArray[index] ? translationArray[index].text : '';
            return `
                <div class="verse-card">
                    <div class="verse-header">
                        <span class="verse-badge">AYAH ${arabicAyah.numberInSurah}</span>
                    </div>
                    <div class="arabic-text">${arabicAyah.text}</div>
                    <div class="translated-text">${translatedText}</div>
                </div>
            `;
        }).join('');

        versesContainer.innerHTML = html;
    }

    function showLoader(visible) {
        loader.style.display = visible ? 'block' : 'none';
    }

    init();
</script>

</body>
</html>
