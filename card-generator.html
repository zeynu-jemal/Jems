<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic Video & Card Studio - Nur AI</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Reem+Kufi:wght@500;700;800&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #02120e 0%, #06382b 40%, #02241b 80%, #0a0f0d 100%);
            --card-glass: rgba(6, 44, 34, 0.75);
            --border-glass: rgba(245, 158, 11, 0.3);
            --gold-accent: #f59e0b;
            --gold-glow: #fde047;
            --emerald-light: #10b981;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --sans-font: 'Plus Jakarta Sans', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--sans-font);
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container { max-width: 1300px; margin: 0 auto; }

        /* Navbar Header */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-glass); border: 1px solid var(--border-glass);
            padding: 12px 24px; border-radius: 16px; backdrop-filter: blur(12px);
            margin-bottom: 25px;
        }

        .logo { font-size: 1.3rem; font-weight: 800; color: var(--gold-accent); display: flex; align-items: center; gap: 8px; }
        .nav-links { display: flex; gap: 12px; flex-wrap: wrap; }
        .nav-btn {
            color: var(--text-light); text-decoration: none; padding: 6px 14px;
            border-radius: 8px; font-size: 0.9rem; font-weight: 600; border: 1px solid transparent; transition: all 0.2s;
        }
        .nav-btn:hover, .nav-btn.active { background: rgba(245, 158, 11, 0.15); border-color: var(--gold-accent); color: var(--gold-glow); }

        /* Hero Banner */
        .hero { text-align: center; margin-bottom: 25px; }
        .badge {
            display: inline-block; background: rgba(245, 158, 11, 0.15); border: 1px solid var(--border-glass);
            color: var(--gold-accent); padding: 6px 18px; border-radius: 30px; font-size: 0.85rem; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px;
        }
        .hero h1 {
            font-size: 2.3rem; font-weight: 800;
            background: linear-gradient(180deg, #ffffff 0%, #fef08a 50%, #f59e0b 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px;
        }

        /* Studio Layout */
        .studio-grid {
            display: grid; grid-template-columns: 1fr 420px; gap: 25px; align-items: start;
        }
        @media (max-width: 950px) { .studio-grid { grid-template-columns: 1fr; } }

        /* Control Panel */
        .controls-card {
            background: var(--card-glass); border: 1px solid var(--border-glass);
            border-radius: 20px; padding: 22px; backdrop-filter: blur(16px);
            display: flex; flex-direction: column; gap: 16px;
        }

        .control-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.82rem; font-weight: 700; color: var(--gold-accent); text-transform: uppercase; letter-spacing: 0.5px; }

        input[type="text"], textarea, select {
            width: 100%; padding: 10px 12px; background: rgba(3, 30, 23, 0.8);
            border: 1px solid var(--border-glass); border-radius: 10px; outline: none; color: #ffffff; font-size: 0.9rem;
        }
        textarea { resize: vertical; min-height: 70px; }

        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

        /* Palette Swatches */
        .swatch-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .swatch {
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: transform 0.2s;
        }
        .swatch:hover, .swatch.active { transform: scale(1.15); border-color: #ffffff; }

        /* Buttons */
        .btn-action {
            padding: 12px; border: none; border-radius: 12px; cursor: pointer;
            font-weight: 800; font-size: 0.95rem; display: flex; align-items: center;
            justify-content: center; gap: 8px; transition: all 0.2s;
        }
        .btn-download { background: linear-gradient(135deg, var(--emerald-light), #059669); color: #fff; }
        .btn-video { background: linear-gradient(135deg, var(--gold-accent), #d97706); color: #000; }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }

        /* Canvas Preview Container */
        .preview-card {
            background: var(--card-glass); border: 1px solid var(--border-glass);
            border-radius: 20px; padding: 20px; backdrop-filter: blur(16px);
            display: flex; flex-direction: column; align-items: center; gap: 12px; position: sticky; top: 20px;
        }

        .preview-wrapper {
            width: 100%; max-width: 300px; aspect-ratio: 9 / 16;
            border-radius: 16px; overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.1);
        }

        canvas { width: 100%; height: 100%; display: block; }
        .recording-status { font-size: 0.85rem; color: #f59e0b; font-weight: 700; display: none; }
    </style>
</head>
<body>

<div class="container">
    <nav class="navbar">
        <div class="logo">🌙 Nur AI Studio</div>
        <div class="nav-links">
            <a href="Main.html" class="nav-btn">Home</a>
            <a href="./HTML/qur'an.html" class="nav-btn">Qur'an</a>
            <a href="hadith.html" class="nav-btn">Hadith</a>
            <a href="card-generator.html" class="nav-btn active">Video & Card Studio</a>
            <a href="NovaMind_AI_Public_API.html" class="nav-btn">AI Chat</a>
        </div>
    </nav>

    <header class="hero">
        <span class="badge">✦ Motion Video & Image Studio ✦</span>
        <h1>Islamic Social Media Studio</h1>
        <p style="color: var(--text-muted);">Design animated videos and image cards for TikTok, Reels, & Stories</p>
    </header>

    <div class="studio-grid">
        <!-- Controls Panel -->
        <div class="controls-card">
            <div class="control-group">
                <label for="presetSelect">⚡ Quick Preset Quotes</label>
                <select id="presetSelect">
                    <option value="">-- Choose a Preset Quote --</option>
                    <option value="p1">Surah Al-Baqarah 2:152 (Remember Me)</option>
                    <option value="p2">Surah Ash-Sharh 94:6 (Ease with Hardship)</option>
                    <option value="p3">Sahih Bukhari #1 (Intentions)</option>
                    <option value="p4">Dua for Knowledge (Rabbi Zidni 'Ilma)</option>
                </select>
            </div>

            <div class="row-2">
                <div class="control-group">
                    <label for="aspectSelect">📐 Canvas Aspect Ratio</label>
                    <select id="aspectSelect">
                        <option value="9:16">9:16 Vertical (Reels/TikTok)</option>
                        <option value="1:1">1:1 Square (Instagram Post)</option>
                        <option value="16:9">16:9 Landscape (YouTube)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="shapeSelect">🔳 Frame Shape</label>
                    <select id="shapeSelect">
                        <option value="rectangle">Classic Rectangle</option>
                        <option value="rounded">Rounded Card</option>
                        <option value="arch">Islamic Arch (Mosque Notch)</option>
                        <option value="circle">Center Medallion</option>
                    </select>
                </div>
            </div>

            <div class="row-2">
                <div class="control-group">
                    <label for="fontSelect">✍️ Arabic Typography</label>
                    <select id="fontSelect">
                        <option value="Amiri">Amiri Classic</option>
                        <option value="Reem Kufi">Reem Kufi Modern</option>
                        <option value="Cairo">Cairo Bold</option>
                        <option value="Tajawal">Tajawal Soft</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="animSelect">✨ CapCut Animation Style</label>
                    <select id="animSelect">
                        <option value="particles">Floating Particles + Pulse</option>
                        <option value="fade">Smooth Fade In</option>
                        <option value="pulse">Glowing Crescent Pulse</option>
                        <option value="static">Static (Image Card)</option>
                    </select>
                </div>
            </div>

            <div class="control-group">
                <label for="arabicInput">📖 Arabic Text</label>
                <textarea id="arabicInput" dir="rtl">إِنَّ معَ العُسْرِ يُسْرًا</textarea>
            </div>

            <div class="control-group">
                <label for="englishInput">🌍 English Translation</label>
                <textarea id="englishInput">"Indeed, with hardship comes ease."</textarea>
            </div>

            <div class="row-2">
                <div class="control-group">
                    <label for="referenceInput">📌 Source Reference</label>
                    <input type="text" id="referenceInput" value="Surah Ash-Sharh 94:6">
                </div>
                <div class="control-group">
                    <label for="watermarkInput">✨ Watermark / Brand</label>
                    <input type="text" id="watermarkInput" value="🌙 Nur AI • Islamic Guidance">
                </div>
            </div>

            <!-- Palettes -->
            <div class="control-group">
                <label>🎨 Background Gradient Presets</label>
                <div class="swatch-group" id="bgSwatches">
                    <div class="swatch active" style="background: linear-gradient(135deg, #064e3b, #022c22);" data-val="g1"></div>
                    <div class="swatch" style="background: linear-gradient(135deg, #1e1b4b, #311042);" data-val="g2"></div>
                    <div class="swatch" style="background: linear-gradient(135deg, #78350f, #451a03);" data-val="g3"></div>
                    <div class="swatch" style="background: linear-gradient(135deg, #0f172a, #1e293b);" data-val="g4"></div>
                    <div class="swatch" style="background: linear-gradient(135deg, #831843, #500724);" data-val="g5"></div>
                    <div class="swatch" style="background: linear-gradient(135deg, #0284c7, #0f172a);" data-val="g6"></div>
                </div>
            </div>

            <div class="row-2">
                <div class="control-group">
                    <label>✍️ Text Color Swatches</label>
                    <div class="swatch-group" id="textSwatches">
                        <div class="swatch active" style="background: #ffffff;" data-color="#ffffff"></div>
                        <div class="swatch" style="background: #fef08a;" data-color="#fef08a"></div>
                        <div class="swatch" style="background: #a7f3d0;" data-color="#a7f3d0"></div>
                        <div class="swatch" style="background: #e2e8f0;" data-color="#e2e8f0"></div>
                    </div>
                </div>
                <div class="control-group">
                    <label>🌟 Accent Color Swatches</label>
                    <div class="swatch-group" id="accentSwatches">
                        <div class="swatch active" style="background: #f59e0b;" data-color="#f59e0b"></div>
                        <div class="swatch" style="background: #10b981;" data-color="#10b981"></div>
                        <div class="swatch" style="background: #ec4899;" data-color="#ec4899"></div>
                        <div class="swatch" style="background: #38bdf8;" data-color="#38bdf8"></div>
                    </div>
                </div>
            </div>

            <div class="row-2">
                <div class="control-group">
                    <label for="customTextColor">Custom Text Color</label>
                    <input type="color" id="customTextColor" value="#ffffff" style="height: 38px;">
                </div>
                <div class="control-group">
                    <label for="customAccentColor">Custom Accent Color</label>
                    <input type="color" id="customAccentColor" value="#f59e0b" style="height: 38px;">
                </div>
            </div>

            <div class="row-2" style="margin-top: 10px;">
                <button class="btn-action btn-download" id="downloadImgBtn">
                    <i class="fa-solid fa-image"></i> Save Image Card
                </button>
                <button class="btn-action btn-video" id="downloadVideoBtn">
                    <i class="fa-solid fa-video"></i> Export Video (.MP4)
                </button>
            </div>
        </div>

        <!-- Preview Canvas -->
        <div class="preview-card">
            <span class="badge">Live Render Studio</span>
            <div class="preview-wrapper" id="previewWrapper">
                <canvas id="cardCanvas" width="1080" height="1920"></canvas>
            </div>
            <div id="recordingStatus" class="recording-status">
                <i class="fa-solid fa-circle-dot fa-beat"></i> Recording Video... Please Wait
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('cardCanvas');
    const ctx = canvas.getContext('2d');

    // DOM References
    const aspectSelect = document.getElementById('aspectSelect');
    const shapeSelect = document.getElementById('shapeSelect');
    const fontSelect = document.getElementById('fontSelect');
    const animSelect = document.getElementById('animSelect');
    const arabicInput = document.getElementById('arabicInput');
    const englishInput = document.getElementById('englishInput');
    const referenceInput = document.getElementById('referenceInput');
    const watermarkInput = document.getElementById('watermarkInput');
    const presetSelect = document.getElementById('presetSelect');
    const customTextColor = document.getElementById('customTextColor');
    const customAccentColor = document.getElementById('customAccentColor');
    const downloadImgBtn = document.getElementById('downloadImgBtn');
    const downloadVideoBtn = document.getElementById('downloadVideoBtn');
    const recordingStatus = document.getElementById('recordingStatus');
    const previewWrapper = document.getElementById('previewWrapper');

    // Animation & State variables
    let currentBgKey = 'g1';
    let textColor = '#ffffff';
    let accentColor = '#f59e0b';
    let animationFrameId = null;
    let animTime = 0;

    // Ambient Particles for Video Animation
    const particles = Array.from({ length: 30 }, () => ({
        x: Math.random() * 1080,
        y: Math.random() * 1920,
        radius: Math.random() * 4 + 2,
        alpha: Math.random(),
        speedY: Math.random() * 1.5 + 0.5
    }));

    // Theme Background Gradients
    const bgGradients = {
        g1: ['#064e3b', '#022c22', '#0f172a'],
        g2: ['#1e1b4b', '#311042', '#0f172a'],
        g3: ['#78350f', '#451a03', '#0f172a'],
        g4: ['#0f172a', '#1e293b', '#090d16'],
        g5: ['#831843', '#500724', '#0f172a'],
        g6: ['#0284c7', '#0f172a', '#0369a1']
    };

    // Quick Presets
    const presets = {
        p1: { ar: "فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ", en: "\"So remember Me; I will remember you. And be grateful to Me and do not deny Me.\"", ref: "Surah Al-Baqarah 2:152" },
        p2: { ar: "إِنَّ مَعَ الْعُسْرِ يُسْرًا", en: "\"Indeed, with hardship comes ease.\"", ref: "Surah Ash-Sharh 94:6" },
        p3: { ar: "إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ", en: "\"Actions are judged by intentions.\"", ref: "Sahih Bukhari #1" },
        p4: { ar: "رَّبِّ زِدْنِي عِلْمًا", en: "\"My Lord, increase me in knowledge.\"", ref: "Surah Taha 20:114" }
    };

    function init() {
        // Swatches Handlers
        setupSwatches('#bgSwatches', (sw) => { currentBgKey = sw.dataset.val; });
        setupSwatches('#textSwatches', (sw) => { textColor = sw.dataset.color; customTextColor.value = textColor; });
        setupSwatches('#accentSwatches', (sw) => { accentColor = sw.dataset.color; customAccentColor.value = accentColor; });

        // Custom Color Inputs
        customTextColor.addEventListener('input', (e) => textColor = e.target.value);
        customAccentColor.addEventListener('input', (e) => accentColor = e.target.value);

        // Aspect Ratio Switcher
        aspectSelect.addEventListener('change', () => {
            const aspect = aspectSelect.value;
            if (aspect === '9:16') { canvas.width = 1080; canvas.height = 1920; previewWrapper.style.aspectRatio = '9 / 16'; }
            else if (aspect === '1:1') { canvas.width = 1080; canvas.height = 1080; previewWrapper.style.aspectRatio = '1 / 1'; }
            else if (aspect === '16:9') { canvas.width = 1920; canvas.height = 1080; previewWrapper.style.aspectRatio = '16 / 9'; }
        });

        // Quick Preset Selection
        presetSelect.addEventListener('change', (e) => {
            const p = presets[e.target.value];
            if (p) {
                arabicInput.value = p.ar;
                englishInput.value = p.en;
                referenceInput.value = p.ref;
            }
        });

        // Download Image
        downloadImgBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'nur-ai-card.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // Download Video
        downloadVideoBtn.addEventListener('click', recordCanvasVideo);

        // Animation Loop
        startAnimationLoop();
    }

    function setupSwatches(containerSelector, callback) {
        document.querySelectorAll(`${containerSelector} .swatch`).forEach(sw => {
            sw.addEventListener('click', () => {
                document.querySelectorAll(`${containerSelector} .swatch`).forEach(s => s.classList.remove('active'));
                sw.classList.add('active');
                callback(sw);
            });
        });
    }

    // Animation Render Loop
    function startAnimationLoop() {
        function loop() {
            animTime += 0.03;
            renderCanvas(animTime);
            animationFrameId = requestAnimationFrame(loop);
        }
        loop();
    }

    // Main Draw Function
    function renderCanvas(t = 0) {
        const W = canvas.width;
        const H = canvas.height;
        const animStyle = animSelect.value;

        // 1. Draw Background
        const colors = bgGradients[currentBgKey] || bgGradients['g1'];
        const grad = ctx.createLinearGradient(0, 0, W, H);
        grad.addColorStop(0, colors[0]);
        grad.addColorStop(0.5, colors[1]);
        grad.addColorStop(1, colors[2]);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // 2. CapCut Style Floating Particle Effects
        if (animStyle === 'particles') {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            particles.forEach(p => {
                p.y -= p.speedY;
                if (p.y < 0) p.y = H;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // 3. Draw Selected Frame Shape
        const shape = shapeSelect.value;
        ctx.strokeStyle = accentColor;
        ctx.lineWidth = W * 0.008;

        if (shape === 'rectangle') {
            ctx.strokeRect(W * 0.05, H * 0.04, W * 0.9, H * 0.92);
        } else if (shape === 'rounded') {
            roundRect(ctx, W * 0.05, H * 0.04, W * 0.9, H * 0.92, 40);
        } else if (shape === 'arch') {
            drawArchFrame(ctx, W, H);
        } else if (shape === 'circle') {
            ctx.beginPath();
            ctx.arc(W / 2, H / 2, Math.min(W, H) * 0.42, 0, Math.PI * 2);
            ctx.stroke();
        }

        // 4. Crescent Icon with Pulse Animation
        let scale = 1;
        if (animStyle === 'pulse' || animStyle === 'particles') {
            scale = 1 + Math.sin(t * 2) * 0.05;
        }

        ctx.save();
        ctx.translate(W / 2, H * 0.15);
        ctx.scale(scale, scale);
        ctx.fillStyle = accentColor;
        ctx.font = `${Math.floor(W * 0.06)}px "Font Awesome 6 Free"`;
        ctx.textAlign = 'center';
        ctx.fillText('🌙', 0, 0);
        ctx.restore();

        // 5. Alpha Control for Fade-in
        if (animStyle === 'fade') {
            ctx.globalAlpha = Math.min(1, (Math.sin(t) + 1) / 1.5);
        } else {
            ctx.globalAlpha = 1;
        }

        // 6. Arabic Text
        const selectedFont = fontSelect.value;
        const arText = arabicInput.value.trim();
        ctx.fillStyle = textColor;
        ctx.font = `bold ${Math.floor(W * 0.055)}px "${selectedFont}", serif`;
        ctx.textAlign = 'center';
        ctx.direction = 'rtl';
        wrapText(ctx, arText, W / 2, H * 0.32, W * 0.8, H * 0.06);

        // Divider Line
        ctx.strokeStyle = accentColor;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(W / 2 - W * 0.15, H * 0.52);
        ctx.lineTo(W / 2 + W * 0.15, H * 0.52);
        ctx.stroke();

        // 7. English Text
        const enText = englishInput.value.trim();
        ctx.fillStyle = textColor;
        ctx.font = `500 ${Math.floor(W * 0.038)}px "Plus Jakarta Sans", sans-serif`;
        ctx.direction = 'ltr';
        wrapText(ctx, enText, W / 2, H * 0.58, W * 0.82, H * 0.045);

        // 8. Reference Badge
        const refText = referenceInput.value.trim();
        if (refText) {
            ctx.fillStyle = accentColor;
            ctx.font = `bold ${Math.floor(W * 0.032)}px "Plus Jakarta Sans", sans-serif`;
            ctx.fillText(`— ${refText} —`, W / 2, H * 0.85);
        }

        // 9. Watermark
        const markText = watermarkInput.value.trim();
        if (markText) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.font = `600 ${Math.floor(W * 0.026)}px "Plus Jakarta Sans", sans-serif`;
            ctx.fillText(markText, W / 2, H * 0.93);
        }

        ctx.globalAlpha = 1;
    }

    // Arch / Mosque Notch Path
    function drawArchFrame(ctx, W, H) {
        ctx.beginPath();
        ctx.moveTo(W * 0.1, H * 0.95);
        ctx.lineTo(W * 0.1, H * 0.25);
        ctx.quadraticCurveTo(W * 0.1, H * 0.05, W / 2, H * 0.05);
        ctx.quadraticCurveTo(W * 0.9, H * 0.05, W * 0.9, H * 0.25);
        ctx.lineTo(W * 0.9, H * 0.95);
        ctx.closePath();
        ctx.stroke();
    }

    // Rounded Rectangle Helper
    function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
        ctx.stroke();
    }

    // Wrap Multi-line Text
    function wrapText(context, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        let currentY = y;

        for (let n = 0; n < words.length; n++) {
            const testLine = line + words[n] + ' ';
            const metrics = context.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) {
                context.fillText(line, x, currentY);
                line = words[n] + ' ';
                currentY += lineHeight;
            } else {
                line = testLine;
            }
        }
        context.fillText(line, x, currentY);
    }

    // Record WebM/MP4 Canvas Video Stream
    function recordCanvasVideo() {
        recordingStatus.style.display = 'block';
        downloadVideoBtn.disabled = true;

        const stream = canvas.captureStream(30); // 30 FPS
        const recordedChunks = [];
        const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'nur-ai-islamic-video.webm';
            a.click();
            URL.revokeObjectURL(url);

            recordingStatus.style.display = 'none';
            downloadVideoBtn.disabled = false;
        };

        mediaRecorder.start();
        setTimeout(() => mediaRecorder.stop(), 5000); // 5 Seconds Recording
    }

    window.onload = init;
</script>

</body>
</html>
