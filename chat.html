<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniAI Zero - Keyless AI Studio</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-panel: #151c2c;
      --bg-card: #1e293b;
      --accent: #06b6d4;
      --accent-purple: #8b5cf6;
      --gradient: linear-gradient(135deg, #06b6d4, #8b5cf6);
      --text-bright: #f8fafc;
      --text-dim: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-bright);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Styling */
    aside {
      width: 280px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 20px;
    }

    .brand {
      font-size: 1.3rem;
      font-weight: 800;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-free {
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid rgba(6, 182, 212, 0.3);
      display: inline-block;
      margin-top: 4px;
    }

    .btn-action {
      background: var(--gradient);
      border: none;
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    .btn-action:hover {
      opacity: 0.9;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.8rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select {
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 10px;
      border-radius: 8px;
      outline: none;
      font-size: 0.9rem;
    }

    /* Main Chat Display */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-main);
    }

    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(21, 28, 44, 0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .indicator {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 85%;
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1rem;
    }

    .user .avatar {
      background: var(--accent-purple);
      color: white;
    }

    .ai .avatar {
      background: var(--accent);
      color: white;
    }

    .bubble {
      background: var(--bg-panel);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .bubble {
      background: #2563eb;
      border: none;
    }

    .generated-img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 12px;
      border: 1px solid var(--border);
    }

    .loader {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Input Bar */
    .input-box {
      padding: 20px;
      border-top: 1px solid var(--border);
      background: var(--bg-panel);
    }

    .input-wrapper {
      display: flex;
      gap: 10px;
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      align-items: center;
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-bright);
      resize: none;
      height: 42px;
      outline: none;
      font-size: 0.95rem;
      padding-top: 8px;
    }

    .btn-send {
      background: var(--gradient);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <aside>
    <div>
      <div class="brand">
        <i class="fa-solid fa-bolt"></i> OmniAI Zero
      </div>
      <span class="badge-free"><i class="fa-solid fa-key"></i> Keyless Connected</span>
    </div>

    <button class="btn-action" onclick="resetChat()">
      <i class="fa-solid fa-plus"></i> New Chat
    </button>

    <div class="control-group">
      <label for="aiMode">Select Engine Mode</label>
      <select id="aiMode">
        <option value="chat">⚡ Instant AI Chat</option>
        <option value="think">🧠 Deep Reasoning Mode</option>
        <option value="image">🎨 Image Generator</option>
      </select>
    </div>
  </aside>

  <main>
    <header>
      <div class="status-pill">
        <div class="indicator"></div>
        <span>Connected to Open API Cloud (No API key needed)</span>
      </div>
    </header>

    <div class="chat-area" id="chatArea">
      <div class="message ai">
        <div class="avatar"><i class="fa-solid fa-robot"></i></div>
        <div class="bubble">Welcome! I am ready to help immediately. You don't need to enter any API keys or logins. Try asking a question or generating an image!</div>
      </div>
    </div>

    <div class="input-box">
      <form class="input-wrapper" onsubmit="handleSend(event)">
        <textarea id="userInput" placeholder="Type a message or prompt..." onkeydown="handleKeyPress(event)"></textarea>
        <button type="submit" class="btn-send"><i class="fa-solid fa-paper-plane"></i></button>
      </form>
    </div>
  </main>

  <script>
    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend(e);
      }
    }

    function resetChat() {
      document.getElementById('chatArea').innerHTML = `
        <div class="message ai">
          <div class="avatar"><i class="fa-solid fa-robot"></i></div>
          <div class="bubble">Chat cleared! What shall we work on next?</div>
        </div>
      `;
    }

    function appendMessage(sender, content, isHTML = false) {
      const chatArea = document.getElementById('chatArea');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.innerHTML = sender === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      if (isHTML) {
        bubble.innerHTML = content;
      } else {
        bubble.textContent = content;
      }

      msgDiv.appendChild(avatar);
      msgDiv.appendChild(bubble);
      chatArea.appendChild(msgDiv);
      chatArea.scrollTop = chatArea.scrollHeight;
      return bubble;
    }

    async function handleSend(e) {
      e.preventDefault();
      const inputEl = document.getElementById('userInput');
      const prompt = inputEl.value.trim();
      const mode = document.getElementById('aiMode').value;

      if (!prompt) return;

      appendMessage('user', prompt);
      inputEl.value = '';

      const aiBubble = appendMessage('ai', '<span class="loader"></span> Thinking...', true);

      try {
        if (mode === 'image') {
          await renderImageResponse(prompt, aiBubble);
        } else if (mode === 'think') {
          await renderTextResponse(prompt, aiBubble, true);
        } else {
          await renderTextResponse(prompt, aiBubble, false);
        }
      } catch (err) {
        aiBubble.textContent = "Error communicating with endpoint: " + err.message;
      }
    }

    async function renderTextResponse(prompt, bubbleEl, isDeepThink) {
      const fullPrompt = isDeepThink
        ? `[System Note: Provide deep, step-by-step reasoning first before giving the final answer.]\n\n${prompt}`
        : prompt;

      const endpoint = `https://text.pollinations.ai/${encodeURIComponent(fullPrompt)}`;

      const response = await fetch(endpoint);

      if (!response.ok) {
        throw new Error("HTTP error " + response.status);
      }

      const text = await response.text();
      
      if (isDeepThink) {
        bubbleEl.innerHTML = `
          <div style="background: rgba(139, 92, 246, 0.15); border-left: 3px solid #8b5cf6; padding: 8px 12px; margin-bottom: 10px; font-size: 0.85rem; color: #c084fc; border-radius: 4px;">
            <i class="fa-solid fa-brain"></i> <strong>Deep Reasoning Mode Active</strong>
          </div>
          <div>${escapeHTML(text)}</div>
        `;
      } else {
        bubbleEl.textContent = text;
      }
    }

    async function renderImageResponse(prompt, bubbleEl) {
      const seed = Math.floor(Math.random() * 1000000);
      const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&seed=${seed}&nologo=true`;

      bubbleEl.innerHTML = `
        <div>Here is your generated artwork for: <em>"${escapeHTML(prompt)}"</em></div>
        <img class="generated-img" src="${imageUrl}" alt="Generated Image" onload="document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight">
      `;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
