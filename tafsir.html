<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Quran Tafsir & Commentary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #064e3b 0%, #022c22 50%, #0f172a 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(255, 255, 255, 0.2);
            --emerald-accent: #10b981;
            --gold-accent: #f59e0b;
            --purple-accent: #a855f7;
            --text-dark: #0f172a;
            --arabic-font: 'Amiri', serif;
            --sans-font: 'Plus Jakarta Sans', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--sans-font);
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container { max-width: 950px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 35px; }

        .badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: var(--gold-accent);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
            backdrop-filter: blur(5px);
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #a7f3d0, #fef08a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p { color: #cbd5e1; font-size: 1.05rem; }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 22px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            margin-bottom: 35px;
        }

        .control-group { display: flex; flex-direction: column; }

        label {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #f1f5f9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid transparent;
            border-radius: 12px;
            outline: none;
            font-family: var(--sans-font);
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:focus {
            border-color: var(--gold-accent);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.25);
        }

        .tafsir-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
        }

        .verse-badge {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 800;
            padding: 6px 16px;
            border-radius: 30px;
        }

        .tafsir-author { font-size: 0.9rem; font-weight: 700; color: #64748b; }

        .arabic-text {
            font-family: var(--arabic-font);
            font-size: 2.2rem;
            text-align: right;
            direction: rtl;
            color: #065f46;
            margin-bottom: 20px;
            line-height: 2.2;
            font-weight: 700;
        }

        .translation-text {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #475569;
            font-weight: 600;
            margin-bottom: 25px;
            padding: 15px;
            background: #f8fafc;
            border-left: 4px solid var(--gold-accent);
            border-radius: 8px;
        }

        .tafsir-section {
            background: #f1f5f9;
            padding: 22px;
            border-radius: 12px;
        }

        .tafsir-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 12px;
        }

        .tafsir-body {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #1e293b;
        }

        /* Clean up HTML formatting tags that API returns */
        .tafsir-body p { margin-bottom: 12px; }

        .tafsir-body.rtl-text {
            direction: rtl;
            text-align: right;
            font-family: var(--arabic-font);
            font-size: 1.4rem;
            line-height: 2.1;
        }

        .loader { text-align: center; padding: 50px; display: none; }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid var(--gold-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            header h1 { font-size: 2rem; }
            .arabic-text { font-size: 1.7rem; }
            .tafsir-card { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <span class="badge">✦ Multilingual Quranic Exegesis ✦</span>
        <h1>التفسير والبيان</h1>
        <p>Explore deep commentary and explanations across global languages</p>
    </header>

    <div class="controls">
        <div class="control-group">
            <label for="surahSelect">📖 Surah</label>
            <select id="surahSelect"></select>
        </div>

        <div class="control-group">
            <label for="verseSelect">🔢 Verse (Ayah)</label>
            <select id="verseSelect"></select>
        </div>

        <div class="control-group">
            <label for="tafsirSelect">📚 Select Tafsir Book</label>
            <select id="tafsirSelect"></select>
        </div>
    </div>

    <div id="loader" class="loader">
        <div class="spinner"></div>
        <p style="color: white; font-weight: 600;">Loading multilingual Tafsir...</p>
    </div>

    <div id="tafsirDisplay" class="tafsir-card" style="display: none;">
        <div class="card-header">
            <span id="verseBadge" class="verse-badge">Surah 1 : Ayah 1</span>
            <span id="tafsirAuthor" class="tafsir-author"></span>
        </div>

        <div id="arabicText" class="arabic-text"></div>
        <div id="translationText" class="translation-text"></div>

        <div class="tafsir-section">
            <div class="tafsir-title">💡 Deep Explanation & Context</div>
            <div id="tafsirBody" class="tafsir-body"></div>
        </div>
    </div>
</div>

<script>
    const QURAN_COM_API = "https://api.quran.com/api/v4";
    const ALQURAN_CLOUD_API = "https://api.alquran.cloud/v1";

    const surahSelect = document.getElementById("surahSelect");
    const verseSelect = document.getElementById("verseSelect");
    const tafsirSelect = document.getElementById("tafsirSelect");
    const tafsirDisplay = document.getElementById("tafsirDisplay");
    const loader = document.getElementById("loader");

    const verseBadge = document.getElementById("verseBadge");
    const tafsirAuthor = document.getElementById("tafsirAuthor");
    const arabicText = document.getElementById("arabicText");
    const translationText = document.getElementById("translationText");
    const tafsirBody = document.getElementById("tafsirBody");

    const languageNamesMap = {
        'ar': 'ARABIC',
        'en': 'ENGLISH',
        'bn': 'BENGALI',
        'ru': 'RUSSIAN',
        'ur': 'URDU',
        'ku': 'KURDISH',
        'id': 'INDONESIAN',
        'tr': 'TURKISH'
    };

    async function init() {
        await Promise.all([loadSurahs(), loadTafsirList()]);
        updateVerseDropdown();

        surahSelect.addEventListener("change", () => {
            updateVerseDropdown();
            fetchTafsirData();
        });
        verseSelect.addEventListener("change", fetchTafsirData);
        tafsirSelect.addEventListener("change", fetchTafsirData);

        fetchTafsirData();
    }

    // 1. Fetch Surah List
    async function loadSurahs() {
        try {
            const res = await fetch(`${ALQURAN_CLOUD_API}/surah`);
            const data = await res.json();
            
            surahSelect.innerHTML = data.data.map(surah => 
                `<option value="${surah.number}" data-count="${surah.numberOfAyahs}">
                    ${surah.number}. ${surah.englishName} (${surah.name})
                </option>`
            ).join('');
        } catch (err) {
            console.error("Error loading Surahs:", err);
        }
    }

    // 2. Fetch All Available Tafsirs across languages from Quran.com API
    async function loadTafsirList() {
        try {
            const res = await fetch(`${QURAN_COM_API}/resources/tafsirs`);
            const data = await res.json();

            tafsirSelect.innerHTML = data.tafsirs.map(tafsir => {
                const langCode = tafsir.language_name.toLowerCase();
                const fullLang = languageNamesMap[langCode] || tafsir.language_name.toUpperCase();
                
                // Set English - Tafsir Ibn Kathir as default selection
                const isSelected = tafsir.id === 169 || tafsir.slug === 'en-tafisr-ibn-kathir' ? 'selected' : '';

                return `<option value="${tafsir.id}" data-slug="${tafsir.slug}" data-lang="${langCode}" ${isSelected}>
                    ${fullLang} — ${tafsir.name} (${tafsir.author_name})
                </option>`;
            }).join('');
        } catch (err) {
            console.error("Error loading Tafsirs:", err);
        }
    }

    // 3. Dynamically adjust Ayah choices according to Surah length
    function updateVerseDropdown() {
        const selectedOption = surahSelect.options[surahSelect.selectedIndex];
        const count = parseInt(selectedOption.getAttribute("data-count")) || 7;

        let optionsHtml = "";
        for (let i = 1; i <= count; i++) {
            optionsHtml += `<option value="${i}">Ayah ${i}</option>`;
        }
        verseSelect.innerHTML = optionsHtml;
    }

    // 4. Fetch Verse Details & Specific Tafsir Commentary
    async function fetchTafsirData() {
        const surah = surahSelect.value;
        const verse = verseSelect.value || 1;
        const tafsirId = tafsirSelect.value;

        if (!surah || !verse || !tafsirId) return;

        showLoader(true);

        try {
            const verseKey = `${surah}:${verse}`;

            // Fetch Arabic text, English translation, and Tafsir concurrently
            const [ayahRes, tafsirRes] = await Promise.all([
                fetch(`${ALQURAN_CLOUD_API}/ayah/${verseKey}/editions/quran-uthmani,en.sahih`),
                fetch(`${QURAN_COM_API}/tafsirs/${tafsirId}/by_ayah/${verseKey}`)
            ]);

            const ayahData = await ayahRes.json();
            const tafsirData = await tafsirRes.json();

            const tafsirContent = tafsirData.tafsir ? tafsirData.tafsir.text : "No Tafsir available for this specific verse in this book.";

            renderTafsir(
                ayahData.data[0].text,
                ayahData.data[1].text,
                tafsirContent,
                surah, verse
            );
        } catch (err) {
            console.error("Error fetching Tafsir:", err);
            tafsirBody.innerHTML = "Unable to fetch Tafsir content right now. Please try another Tafsir edition.";
        } finally {
            showLoader(false);
        }
    }

    // 5. Render to Page
    function renderTafsir(arabic, translation, tafsirHtml, surah, verse) {
        const selectedOption = tafsirSelect.options[tafsirSelect.selectedIndex];
        const langCode = selectedOption.getAttribute("data-lang");

        verseBadge.textContent = `Surah ${surah} : Ayah ${verse}`;
        tafsirAuthor.textContent = selectedOption.text;

        arabicText.textContent = arabic;
        translationText.textContent = translation;

        tafsirBody.innerHTML = tafsirHtml;

        // Automatically format Right-to-Left for Arabic, Urdu, Kurdish, etc.
        if (['ar', 'ur', 'fa', 'ku', 'sd'].includes(langCode)) {
            tafsirBody.classList.add("rtl-text");
        } else {
            tafsirBody.classList.remove("rtl-text");
        }

        tafsirDisplay.style.display = 'block';
    }

    function showLoader(visible) {
        loader.style.display = visible ? 'block' : 'none';
        if (visible) tafsirDisplay.style.display = 'none';
    }

    init();
</script>

</body>
</html>
