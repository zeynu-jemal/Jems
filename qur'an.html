<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الكريم - Full Arabic Experience</title>
    <!-- Google Fonts for High-Quality Quranic Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #031e17;
            --card-glass: rgba(6, 44, 34, 0.75);
            --border-glass: rgba(245, 158, 11, 0.3);
            --gold-accent: #f59e0b;
            --gold-glow: #fde047;
            --emerald-light: #10b981;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --arabic-font: 'Amiri', serif;
            --title-font: 'Reem Kufi', sans-serif;
            --ui-font: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--ui-font);
            background: linear-gradient(135deg, #02120e 0%, #06382b 40%, #02241b 80%, #0a0f0d 100%);
            background-attachment: fixed;
            color: var(--text-light);
            min-height: 100vh;
            padding: 25px 15px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Hero Header */
        header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--border-glass);
            color: var(--gold-accent);
            padding: 6px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 15px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
        }

        header h1 {
            font-family: var(--title-font);
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(180deg, #ffffff 0%, #fef08a 50%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            text-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }

        header p {
            color: #a7f3d0;
            font-size: 1.1rem;
            font-family: var(--arabic-font);
        }

        /* Controls Area */
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--gold-accent);
            text-transform: uppercase;
        }

        select, input {
            padding: 12px 14px;
            background: rgba(3, 30, 23, 0.8);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            outline: none;
            font-family: var(--arabic-font);
            font-size: 1.05rem;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:focus, input:focus {
            border-color: var(--gold-glow);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
        }

        /* Surah Header Banner */
        .surah-banner {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2) 0%, rgba(245, 158, 11, 0.15) 100%);
            border: 1px solid var(--border-glass);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none;
        }

        .surah-banner h2 {
            font-family: var(--title-font);
            font-size: 2.5rem;
            color: var(--gold-glow);
            margin-bottom: 8px;
        }

        .surah-banner .meta-info {
            font-size: 0.95rem;
            color: #cbd5e1;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-family: var(--ui-font);
            direction: ltr;
        }

        /* Ayah Cards */
        .verses-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .verse-card {
            background: var(--card-glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .verse-card:hover {
            transform: translateY(-3px);
            border-color: var(--border-glass);
        }

        .verse-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            direction: ltr;
        }

        .verse-badge {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #000000;
            font-size: 0.85rem;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn-action:hover {
            background: var(--emerald-light);
            border-color: var(--emerald-light);
            color: #000;
            transform: scale(1.1);
        }

        .arabic-full-text {
            font-family: var(--arabic-font);
            font-size: 2.3rem;
            text-align: right;
            direction: rtl;
            color: #ffffff;
            line-height: 2.4;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        /* Loader */
        .loader {
            text-align: center;
            padding: 50px;
            display: none;
        }

        .spinner {
            width: 55px;
            height: 55px;
            border: 5px solid rgba(245, 158, 11, 0.2);
            border-top: 5px solid var(--gold-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            header h1 { font-size: 2.5rem; }
            .arabic-full-text { font-size: 1.8rem; line-height: 2.1; }
            .verse-card { padding: 18px; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <span class="badge">✦ القرآن الكريم كاملاً ✦</span>
        <h1>الْقُرْآنُ الْكَرِيمُ</h1>
        <p>Full Uthmani Script Arabic Text & Audio Recitation</p>
    </header>

    <div class="controls">
        <div class="control-group">
            <label for="surahSelect">📖 اختر السورة (Select Surah)</label>
            <select id="surahSelect"></select>
        </div>

        <div class="control-group">
            <label for="reciterSelect">🎙️ القارئ (Reciter)</label>
            <select id="reciterSelect">
                <option value="ar.alafasy">Mishary Rashid Alafasy</option>
                <option value="ar.abdulbasitmurattal">Abdul Basit (Murattal)</option>
                <option value="ar.hudhaify">Ali Al-Hudhaify</option>
                <option value="ar.shaatree">Abu Bakr Al-Shatri</option>
            </select>
        </div>

        <div class="control-group">
            <label for="searchInput">🔍 بحث في الآيات (Filter Text)</label>
            <input type="text" id="searchInput" placeholder="Type Arabic text...">
        </div>
    </div>

    <!-- Surah Header Banner -->
    <div id="surahBanner" class="surah-banner">
        <h2 id="surahArabicName"></h2>
        <div class="meta-info">
            <span id="surahEnglishMeta"></span> • 
            <span id="surahAyahCount"></span>
        </div>
    </div>

    <div id="loader" class="loader">
        <div class="spinner"></div>
        <p style="color: #fef08a; font-weight: 600;">جاري تحميل النص القرآني...</p>
    </div>

    <div id="versesContainer" class="verses-container"></div>
</div>

<script>

    const API_BASE = "https://api.alquran.cloud/v1";

    const surahSelect = document.getElementById("surahSelect");
    const reciterSelect = document.getElementById("reciterSelect");
    const searchInput = document.getElementById("searchInput");
    const versesContainer = document.getElementById("versesContainer");
    const surahBanner = document.getElementById("surahBanner");
    const loader = document.getElementById("loader");

    let currentAyahsData = [];

    async function init() {
        await loadSurahsList();
        fetchSurahArabicText();

        surahSelect.addEventListener("change", fetchSurahArabicText);
        reciterSelect.addEventListener("change", fetchSurahArabicText);
        searchInput.addEventListener("input", filterVerses);
    }

    // 1. Fetch List of 114 Surahs
    async function loadSurahsList() {
        try {
            const res = await fetch(`${API_BASE}/surah`);
            const data = await res.json();

            surahSelect.innerHTML = data.data.map(surah => `
                <option value="${surah.number}">
                    ${surah.number}. ${surah.name} — (${surah.englishName})
                </option>
            `).join('');
        } catch (err) {
            console.error("Failed to load Surah list:", err);
        }
    }

    // 2. Fetch Full Arabic Text (Uthmani) + Recitation Audio
    async function fetchSurahArabicText() {
        const surahId = surahSelect.value;
        const reciter = reciterSelect.value;

        if (!surahId) return;

        showLoader(true);
        versesContainer.innerHTML = '';

        try {
            // Fetch Uthmani Arabic Text & Recitation concurrently
            const res = await fetch(`${API_BASE}/surah/${surahId}/editions/quran-uthmani,${reciter}`);
            const result = await res.json();

            const arabicData = result.data[0];
            const audioData = result.data[1];

            // Render Banner Info
            document.getElementById("surahArabicName").textContent = arabicData.name;
            document.getElementById("surahEnglishMeta").textContent = `${arabicData.englishName} (${arabicData.revelationType})`;
            document.getElementById("surahAyahCount").textContent = `${arabicData.numberOfAyahs} Verses`;
            surahBanner.style.display = 'block';

            // Merge Arabic Text with Audio URLs
            currentAyahsData = arabicData.ayahs.map((ayah, idx) => ({
                numberInSurah: ayah.numberInSurah,
                text: ayah.text,
                audio: audioData.ayahs[idx] ? audioData.ayahs[idx].audio : ''
            }));

            renderVerses(currentAyahsData);
        } catch (err) {
            console.error("Error fetching Arabic text:", err);
            versesContainer.innerHTML = `<p style="color: #f87171; text-align: center;">خطأ في تحميل البيانات. يرجى التحقق من الاتصال.</p>`;
        } finally {
            showLoader(false);
        }
    }

    // 3. Render Verses to DOM
    function renderVerses(ayahs) {
        if (ayahs.length === 0) {
            versesContainer.innerHTML = `<p style="text-align: center; color: #cbd5e1;">لم يتم العثور على نتائج للبحث</p>`;
            return;
        }

        const html = ayahs.map(ayah => `
            <div class="verse-card">
                <div class="verse-top-bar">
                    <span class="verse-badge">آية ${ayah.numberInSurah}</span>
                    <div class="actions">
                        <button class="btn-action" title="Play Audio" onclick="playAudio('${ayah.audio}', this)">▶</button>
                        <button class="btn-action" title="Copy Verse" onclick="copyVerse('${ayah.text}')">📋</button>
                    </div>
                </div>
                <div class="arabic-full-text">${ayah.text}</div>
            </div>
        `).join('');

        versesContainer.innerHTML = html;
    }

    // 4. Live Arabic Search Filter
    function filterVerses() {
        const query = searchInput.value.trim();
        if (!query) {
            renderVerses(currentAyahsData);
            return;
        }

        const filtered = currentAyahsData.filter(a => a.text.includes(query));
        renderVerses(filtered);
    }

    // Audio Playback Handler
    let currentAudio = null;
    let currentBtn = null;

    window.playAudio = function(url, btn) {
        if (!url) return;

        if (currentAudio) {
            currentAudio.pause();
            if (currentBtn) currentBtn.textContent = '▶';
        }

        if (currentAudio && currentAudio.src === url && !currentAudio.paused) {
            return;
        }

        currentAudio = new Audio(url);
        currentBtn = btn;
        btn.textContent = '⏸';

        currentAudio.play();
        currentAudio.onended = () => {
            btn.textContent = '▶';
        };
    };

    // Copy Verse Function
    window.copyVerse = function(text) {
        navigator.clipboard.writeText(text);
        alert("تم نسخ الآية بنجاح!");
    };

    function showLoader(visible) {
        loader.style.display = visible ? 'block' : 'none';
        if (visible) surahBanner.style.display = 'none';
    }

    init();
</script>

</body>
</html>
